@if (agent(); as a) {
  <a routerLink="/agents">← Back to agents</a>
  <h2>{{ a.name }}</h2>
  <p><strong>Model:</strong> {{ a.model }}</p>
  <p>{{ a.description }}</p>
  <h3>Tools</h3>
  <ul>
    @for (t of a.tools; track t) {
      <li>{{ t }}</li>
    }
  </ul>
} @else {
  <p>Agent not found.</p>
}
